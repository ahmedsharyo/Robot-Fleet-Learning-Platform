services:
  orchestrator:
    build: {context: ., dockerfile: orchestrator/Dockerfile}
    environment: {FLEET_ADDR: ":8080", FLEET_DB: "/var/lib/fleet/fleet.db"}
    volumes: ["fleet-data:/var/lib/fleet", "./artifacts:/workspace/artifacts"]
    ports: ["8080:8080"]
  simulation-worker:
    build: {context: ., dockerfile: workers/Dockerfile}
    environment: {FLEET_URL: "http://orchestrator:8080", FLEET_ARTIFACTS: "/workspace/artifacts"}
    volumes: ["./artifacts:/workspace/artifacts"]
    depends_on: [orchestrator]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [orchestrator]
  grafana:
    image: grafana/grafana:11.3.0
    volumes: ["./monitoring/grafana:/etc/grafana/provisioning:ro", "grafana-data:/var/lib/grafana"]
    ports: ["3000:3000"]
    depends_on: [prometheus]
volumes:
  fleet-data:
  grafana-data:
